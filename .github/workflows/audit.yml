name: Audit

# Fails when a production dependency has a known high or critical
# vulnerability. Also runs weekly, since advisories are published without any
# change here. To fix one in a transitive dependency whose parent pins a
# vulnerable version, add an override to that package's pnpm-workspace.yaml.

on:
  push:
    branches: [main, next]
    tags-ignore:
      - "v*"
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main, next]
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/pnpm-workspace.yaml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pnpm-audit:
    strategy:
      fail-fast: false
      matrix:
        package: [server, web, desktop]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ${{ matrix.package }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Reads the lockfile only; nothing is installed.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
