name: GitHub Pages

# Publishes the web app on this repository's GitHub Pages site, without a
# server (see web/lib/local-backend):
#   /       the app, keeping the notes in the visitor's browser
#   /demo/  a playground with sample notes, kept in memory (a reload resets
#           it), and a demo of each feature, e.g. /demo/freeze
# Run by each release (release-fork.yml), or by hand. Needs Settings › Pages ›
# Source set to "GitHub Actions"; until it is, the site is skipped with a
# warning rather than failing the release.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits for the one running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A repository without a Pages site (or one built from a branch) can't take
  # this deployment, and configure-pages can't enable it with this token.
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check that Pages is set up
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$BUILD_TYPE" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages not set up::Skipping the site. Set Settings › Pages › Source to \"GitHub Actions\" (https://github.com/$GITHUB_REPOSITORY/settings/pages) and run this workflow again."
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # The site is served from /<repository>, its base path.
      - name: Build the app and the demo
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build:pages

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
