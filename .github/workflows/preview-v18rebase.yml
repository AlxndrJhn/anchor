name: Preview (v18rebase)

# Test builds of the v18rebase branch (the fork rebased onto upstream's
# redesigned app), made on every push to it or by hand: an APK, kept as this
# run's "anchor-preview-apk" artifact, and the Docker image
# ghcr.io/<owner>/anchor:v18rebase (also :v18rebase-<sha>). Nothing is
# released, so the fork's apps don't offer these as updates.
#
# The APK installs as "Anchor+ preview" (com.alxndrjhn.anchorplus.preview),
# next to Anchor+ rather than over it: the redesign moves the notes to a new
# local database, so try it on its own sign-in before trusting it with the
# app you use.

on:
  push:
    branches: [v18rebase]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      tags: |
        type=raw,value=v18rebase
        type=sha,prefix=v18rebase-

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      ORG_GRADLE_PROJECT_anchorFork: "true"
      ORG_GRADLE_PROJECT_anchorPreview: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # The same key as the fork's releases, from the repository's secrets
      # (see release-fork.yml).
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
            [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS secrets to sign the APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          STORE_FILE=./upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$STORE_FILE
          EOF

      # No FORK_BUILD or UPDATE_REPO: a preview doesn't update itself.
      - name: Build APK
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION-preview.${GITHUB_SHA::7}" \
            --build-number="$GITHUB_RUN_NUMBER"
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk anchor-preview.apk
          mv app-armeabi-v7a-release.apk anchor-preview-armeabi-v7a.apk
          mv app-x86_64-release.apk anchor-preview-x86_64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: anchor-preview-apk
          path: mobile/build/app/outputs/flutter-apk/anchor-preview*.apk
