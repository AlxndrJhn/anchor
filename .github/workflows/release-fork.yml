name: Release (fork)

# Every push to main releases this fork: a GitHub release tagged
# fork-<app version>.<run>, with the APK and the desktop installers (Windows,
# macOS) attached, and the Docker image
# (amd64 + arm64) tagged with the same name plus :fork-latest and
# :fork-<sha>. The newest APK (arm64, for nearly every phone) is always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/anchor-fork.apk

on:
  push:
    branches: [main]
    tags-ignore:
      - "v*"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Queue releases instead of cancelling one that is half published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Name the release
        id: version
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' mobile/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=fork-$VERSION.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: ${{ github.ref == 'refs/heads/main' }}
      tags: |
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=fork-latest
        type=sha,prefix=fork-

  build-apk:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # Installs as "Anchor (fork)" next to the official app.
      ORG_GRADLE_PROJECT_anchorFork: "true"
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Use the repository's own key when its secrets are set. Otherwise keep a
      # generated key in the Actions cache, so later builds install as updates.
      - name: Restore generated signing key
        if: ${{ env.HAS_KEY != 'true' }}
        id: key-cache
        uses: actions/cache@v6
        with:
          path: mobile/android/app/fork-keystore.jks
          key: android-fork-signing-key-v1

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            STORE_FILE=./upload-keystore.jks
          else
            KEYSTORE_PASSWORD=anchor-fork
            KEY_PASSWORD=anchor-fork
            KEY_ALIAS=anchor-fork
            STORE_FILE=./fork-keystore.jks
            if [ ! -f android/app/fork-keystore.jks ]; then
              keytool -genkeypair -v -keystore android/app/fork-keystore.jks \
                -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
                -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Anchor fork"
            fi
          fi
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$STORE_FILE
          EOF

      - name: Build APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # One APK per processor type: a phone only uses one, and an APK with
        # all three is about three times the size. Build numbers continue past
        # the old "Android APK" workflow's (1000 + run), and Flutter adds
        # 1000 × the type's number (arm64 2, x86_64 4) on top, so a new APK
        # always installs as an update, also over the older all-in-one ones.
        # FORK_BUILD (the number ending the release tag) and UPDATE_REPO let
        # the app find and install newer releases itself.
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION-fork.${GITHUB_SHA::7}" \
            --build-number=$((2000 + GITHUB_RUN_NUMBER)) \
            --dart-define=FORK_BUILD="$GITHUB_RUN_NUMBER" \
            --dart-define=UPDATE_REPO="$GITHUB_REPOSITORY"
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk anchor-fork.apk
          mv app-armeabi-v7a-release.apk anchor-fork-armeabi-v7a.apk
          mv app-x86_64-release.apk anchor-fork-x86_64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: anchor-fork-apk
          path: mobile/build/app/outputs/flutter-apk/anchor-fork*.apk

  build-desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # -> Anchor-Setup-<version>.exe
            targets: --win nsis --x64
          - os: macos-latest
            name: macos
            # One .dmg for Apple silicon and Intel: Anchor-<version>-universal.dmg
            targets: --mac dmg --universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      # Unsigned: no certificate is looked for, the macOS app is ad-hoc signed
      # (see electron-builder.yml) and nothing is notarized or published.
      - name: Build installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder ${{ matrix.targets }} --publish never \
            -c.extraMetadata.version="$VERSION"
          ls -l dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: anchor-desktop-${{ matrix.name }}
          path: |
            desktop/dist/Anchor-*.exe
            desktop/dist/Anchor-*.dmg
          if-no-files-found: error

  release:
    needs: [version, build-apk, build-desktop, docker]
    # The desktop installers are welcome but optional: a release still goes
    # out with the APKs and the image when they fail to build.
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      needs.version.result == 'success' &&
      needs.build-apk.result == 'success' &&
      needs.docker.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: anchor-fork-apk

      - name: Download desktop installers
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: anchor-desktop-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE=${IMAGE,,}
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'fork-*' HEAD^ 2>/dev/null || true)
          {
            echo "Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            echo "## Android"
            echo
            echo 'Install `anchor-fork.apk`. It installs as "Anchor (fork)", next to the official app, and updates the previous fork build.'
            echo
            echo 'It is for 64-bit ARM, which nearly every phone since 2017 is. For an older 32-bit phone take `anchor-fork-armeabi-v7a.apk`; for an emulator or x86 tablet, `anchor-fork-x86_64.apk`.'
            echo
            if ls Anchor-*.exe Anchor-*.dmg >/dev/null 2>&1; then
              echo "## Desktop (Windows, macOS)"
              echo
              echo "Windows: run \`$(ls Anchor-Setup-*.exe 2>/dev/null)\`. macOS (Apple silicon and Intel): open \`$(ls Anchor-*.dmg 2>/dev/null)\` and drag Anchor to Applications. On first launch it asks for your Anchor server's address."
              echo
              echo 'The installers are not signed. On Windows, if SmartScreen stops it, choose More info › Run anyway. On macOS, right-click the app and choose Open the first time, or allow it under System Settings › Privacy & Security.'
              echo
            fi
            echo "## Docker (amd64, arm64)"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$TAG"
            echo '```'
            echo
            echo "Also published as \`$IMAGE:fork-latest\` and \`$IMAGE:fork-${GITHUB_SHA::7}\`."
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s (%h)' "$PREVIOUS..HEAD"
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG"
            else
              git log --no-merges --format='- %s (%h)' -20
            fi
          } > notes.md
          shopt -s nullglob
          gh release create "$TAG" anchor-fork*.apk Anchor-*.exe Anchor-*.dmg \
            --target "$GITHUB_SHA" \
            --title "Anchor fork $TAG" \
            --notes-file notes.md \
            --latest
          # Superseded by the per-commit releases above.
          gh release delete android-latest --cleanup-tag --yes || true
