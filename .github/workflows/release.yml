name: Release

# Releases Anchor+ when started by hand (Actions › Release › Run workflow, on
# main): a GitHub release tagged v<app version>.<run>, with the APKs and the
# desktop installers (Windows, macOS) attached, and the Docker image
# (amd64 + arm64) tagged with the same name plus :latest and :sha-<sha>. The web app is then published on GitHub Pages, with its demo
# (pages.yml). Only what changed since the last release is built: a release
# whose Android app, server or desktop app didn't change has no APKs, new
# image or installers, and the apps only update to releases that have theirs.
# The APKs also go to the F-Droid repositories on Pages (pages.yml), and a
# new Windows installer to winget (the winget job).
#
# With "candidate" ticked (`gh workflow run release.yml --ref main -f
# candidate=true`) it is a release candidate instead: a GitHub prerelease,
# and an image tagged :preview (not :latest) that names itself so in
# /api/health. The apps only offer it when "Receive preview releases" is on
# and their server runs that image. The web app on Pages stays the last
# release's; the preview F-Droid repository gets the candidate's APKs.
# Releases also update :preview, so preview servers never fall behind.
#
# Bridge from the old names: releases used to be tagged fork-<version>.<run>,
# with anchor-fork*.apk and images :fork-latest / :fork-preview, and the apps
# installed before the rename only look for those. With "bridge" ticked, a
# release is published a second time under its fork- tag with the APKs under
# their old names, so those apps update to this one, which knows the new
# names. This workflow, the apps and the F-Droid repositories ignore that
# copy (its title ends in "(bridge)"). The images are still also pushed as
# :fork-latest and :fork-preview, for servers that pull those.
# TODO: drop the bridge and the :fork-* image tags once installs moved over.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Release candidate, for preview servers and apps only
        type: boolean
        default: false
      bridge:
        description: Also publish under the old fork- tag and APK names, for apps installed before the rename
        type: boolean
        default: false

# Queue releases instead of cancelling one that is half published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      anchor_version: ${{ steps.version.outputs.anchor_version }}
      candidate: ${{ steps.version.outputs.candidate }}
      preview_image: ${{ steps.version.outputs.preview_image }}
      previous: ${{ steps.changes.outputs.previous }}
      released: ${{ steps.changes.outputs.released }}
      released_version: ${{ steps.changes.outputs.released_version }}
      apk: ${{ steps.changes.outputs.apk }}
      apk_tag: ${{ steps.changes.outputs.apk_tag }}
      docker: ${{ steps.changes.outputs.docker }}
      docker_tag: ${{ steps.changes.outputs.docker_tag }}
      desktop: ${{ steps.changes.outputs.desktop }}
      desktop_tag: ${{ steps.changes.outputs.desktop_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Name the release
        id: version
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' mobile/pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "anchor_version=$VERSION.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "candidate=${{ inputs.candidate == true }}" >> "$GITHUB_OUTPUT"
          IMAGE="ghcr.io/$GITHUB_REPOSITORY"
          echo "preview_image=${IMAGE,,}:preview" >> "$GITHUB_OUTPUT"

      # Every build gets a new build number, so the apps would offer each
      # release as an update. Build the APK, the Docker image and the desktop
      # installers only when what goes into them changed since the last
      # release that has them (a version bump alone doesn't count). Otherwise
      # the release goes out without them, the apps skip it, and the notes
      # point at the release whose build is still current. With nothing
      # changed at all, there is no release. A release compares with the last
      # release, which its users have; a candidate with the last of either.
      - name: Check what changed
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.version.outputs.candidate }}
        run: |
          # Without the bridge copies, which repeat a release under its old tag.
          RELEASES=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq '[.[] | select(.name // "" | endswith("(bridge)") | not)]')
          # The last release, whose web app Pages keeps during a candidate.
          RELEASED=$(jq -r '[.[] | select((.draft or .prerelease) | not)][0].tag_name // ""' <<< "$RELEASES")
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          # v0.18.0.81 is 0.18.0.81; fork-0.18.0.80 (before the rename) too.
          RELEASED_VERSION=${RELEASED#fork-}
          echo "released_version=${RELEASED_VERSION#v}" >> "$GITHUB_OUTPUT"
          if [ "$CANDIDATE" != true ]; then
            RELEASES=$(jq '[.[] | select(.prerelease | not)]' <<< "$RELEASES")
          fi
          last_with() { jq -r "[.[] | select(.draft | not) | $1][0] // \"\"" <<< "$RELEASES"; }
          # $1: the build's name, $2: the last release that has it, then the
          # files that go into it.
          check() {
            local name=$1 last=$2
            shift 2
            # A candidate always has its own image: :preview must name
            # itself so, whatever went into the last one.
            if [ "$name" = docker ] && [ "$CANDIDATE" = true ]; then
              echo "docker=true" >> "$GITHUB_OUTPUT"
              return
            fi
            if [ -n "$last" ] && git rev-parse -q --verify "refs/tags/$last" >/dev/null &&
              git diff --quiet -I '^version:' "$last" HEAD -- "$@" .github/workflows/release.yml; then
              echo "No $name changes since $last; not building it."
              echo "$name=false" >> "$GITHUB_OUTPUT"
              echo "${name}_tag=$last" >> "$GITHUB_OUTPUT"
            else
              echo "$name=true" >> "$GITHUB_OUTPUT"
            fi
          }
          check apk \
            "$(last_with 'select(any(.assets[]; .name == "anchor-plus.apk" or .name == "anchor-fork.apk")) | .tag_name')" \
            mobile/lib mobile/android mobile/assets mobile/pubspec.yaml mobile/pubspec.lock
          # The image tag a release's notes say to pull: its own, or the one
          # an unchanged release carried over.
          check docker \
            "$(last_with '.body // "" | capture("docker pull [^:\\s]+:(?<t>(v|fork-)[0-9.]+)").t')" \
            Dockerfile .dockerignore server web docker .github/workflows/docker-build.yml
          check desktop \
            "$(last_with 'select(any(.assets[]; .name | test("^Anchor-.*\\.(exe|dmg)$"))) | .tag_name')" \
            desktop web
          # The changes in the notes start from here.
          echo "previous=$(last_with '.tag_name')" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    if: needs.version.outputs.docker == 'true' && needs.version.outputs.candidate != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: ${{ github.ref == 'refs/heads/main' }}
      tags: |
        type=raw,value=${{ needs.version.outputs.tag }}
        type=raw,value=latest
        type=sha,prefix=sha-
        type=raw,value=fork-latest
      build-args: |
        ANCHOR_VERSION=${{ needs.version.outputs.anchor_version }}

  # The image preview servers run: a candidate's own, or a new release's
  # again, naming itself :preview so the apps there offer candidates.
  # Only the last layer differs, so the second build comes from the cache.
  docker-preview:
    needs: [version, docker]
    if: >-
      !cancelled() && needs.version.result == 'success' &&
      (needs.version.outputs.candidate == 'true' || needs.docker.result == 'success')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      push: ${{ github.ref == 'refs/heads/main' }}
      tags: |
        type=raw,value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.candidate == 'true' }}
        type=raw,value=preview
        type=raw,value=fork-preview
      build-args: |
        ANCHOR_VERSION=${{ needs.version.outputs.anchor_version }}
        ANCHOR_IMAGE=${{ needs.version.outputs.preview_image }}

  build-apk:
    needs: version
    if: needs.version.outputs.apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # Installs as "Anchor+".
      ORG_GRADLE_PROJECT_anchorPlus: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Always the repository's own key, from its secrets: an APK signed with
      # any other key doesn't install over the earlier builds. (A key
      # kept in the Actions cache was evicted once the cache filled up, and
      # fork-0.18.0.65 went out signed with a new one.) Without the secrets
      # the build stops rather than sign with a key nobody has.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
            [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Set the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS secrets to sign the APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=./upload-keystore.jks
          EOF

      - name: Build APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # One APK per processor type: a phone only uses one, and an APK with
        # all three is about three times the size. Build numbers continue past
        # the old "Android APK" workflow's (1000 + run), and Flutter adds
        # 1000 × the type's number (arm64 2, x86_64 4) on top, so a new APK
        # always installs as an update, also over the older all-in-one ones.
        # RELEASE_BUILD (the number ending the release tag) and UPDATE_REPO let
        # the app find and install newer releases itself.
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION-g${GITHUB_SHA::7}" \
            --build-number=$((2000 + GITHUB_RUN_NUMBER)) \
            --dart-define=RELEASE_BUILD="$GITHUB_RUN_NUMBER" \
            --dart-define=UPDATE_REPO="$GITHUB_REPOSITORY"
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk anchor-plus.apk
          mv app-armeabi-v7a-release.apk anchor-plus-armeabi-v7a.apk
          mv app-x86_64-release.apk anchor-plus-x86_64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: anchor-plus-apk
          path: mobile/build/app/outputs/flutter-apk/anchor-plus*.apk

  build-desktop:
    needs: version
    if: needs.version.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            # -> Anchor-Setup-<version>.exe
            targets: --win nsis --x64
          - os: macos-latest
            name: macos
            # One .dmg for Apple silicon and Intel: Anchor-<version>-universal.dmg
            targets: --mac dmg --universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      # The web client built in, which keeps the notes on the computer until
      # a server is set; electron-builder.yml packages web/out.
      - name: Build the web client without a server
        working-directory: web
        env:
          ANCHOR_VERSION: ${{ needs.version.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build:local

      # Unsigned: no certificate is looked for, the macOS app is ad-hoc signed
      # (see electron-builder.yml) and nothing is notarized or published.
      # anchorBuild (the number ending the release tag) and anchorUpdateRepo
      # let the app find and install newer releases itself (src/updater.js).
      # buildNumber, the same number, makes the app's file version
      # <version>.<build>, which the Windows installer names in Apps &
      # features for winget (build/installer.nsh).
      - name: Build installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm exec electron-builder ${{ matrix.targets }} --publish never \
            -c.buildNumber="$GITHUB_RUN_NUMBER" \
            -c.extraMetadata.version="$VERSION" \
            -c.extraMetadata.anchorBuild="$GITHUB_RUN_NUMBER" \
            -c.extraMetadata.anchorUpdateRepo="$GITHUB_REPOSITORY"
          ls -l dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: anchor-desktop-${{ matrix.name }}
          path: |
            desktop/dist/Anchor-*.exe
            desktop/dist/Anchor-*.dmg
          if-no-files-found: error

  release:
    needs: [version, build-apk, build-desktop, docker, docker-preview]
    # The desktop installers are welcome but optional: a release still goes
    # out with the APKs and the image when they fail to build. A build whose
    # files didn't change is skipped, and with nothing changed there is no
    # release.
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      needs.version.result == 'success' &&
      (needs.version.outputs.apk == 'true' || needs.version.outputs.docker == 'true' ||
        needs.version.outputs.desktop == 'true') &&
      (needs.build-apk.result == 'success' || needs.version.outputs.apk == 'false') &&
      (needs.version.outputs.candidate == 'true' && needs.docker-preview.result == 'success' ||
        needs.version.outputs.candidate != 'true' &&
          (needs.docker.result == 'success' || needs.version.outputs.docker == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build attestations: a Sigstore certificate (id-token), and
      # storing the attestation with the repository.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK
        if: needs.version.outputs.apk == 'true'
        uses: actions/download-artifact@v8
        with:
          name: anchor-plus-apk

      - name: Download desktop installers
        if: needs.version.outputs.desktop == 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: anchor-desktop-*
          merge-multiple: true

      # Signs a record that each file was built by this workflow from this
      # commit, so anyone can check a download with `gh attestation verify`.
      # The installers stay unsigned for Windows and macOS themselves.
      - name: Attest the release files
        if: hashFiles('anchor-plus*.apk', 'Anchor-*.exe', 'Anchor-*.dmg') != ''
        uses: actions/attest@v4
        with:
          subject-path: |
            anchor-plus*.apk
            Anchor-*.exe
            Anchor-*.dmg

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          APK_TAG: ${{ needs.version.outputs.apk_tag }}
          DOCKER_TAG: ${{ needs.version.outputs.docker_tag }}
          DESKTOP_TAG: ${{ needs.version.outputs.desktop_tag }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
          CANDIDATE: ${{ needs.version.outputs.candidate }}
          PREVIEW_IMAGE: ${{ needs.version.outputs.preview_image }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          IMAGE=${IMAGE,,}
          {
            echo "Built from ${GITHUB_SHA::7} on $(date -u +'%Y-%m-%d %H:%M UTC')."
            echo
            if [ "$CANDIDATE" = true ]; then
              echo "**Release candidate.** The apps offer it only with Receive preview releases on in their settings, and a server running \`$PREVIEW_IMAGE\`."
              echo
            fi
            echo "## Android"
            echo
            if ls anchor-plus*.apk >/dev/null 2>&1; then
              echo 'Install `anchor-plus.apk`. It installs as "Anchor+" and updates the previous build.'
              echo
              echo 'It is for 64-bit ARM, which nearly every phone since 2017 is. For an older 32-bit phone take `anchor-plus-armeabi-v7a.apk`; for an emulator or x86 tablet, `anchor-plus-x86_64.apk`.'
            else
              echo "Nothing changed for Android, so this release has no APK. The newest one is in [$APK_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$APK_TAG)."
            fi
            echo
            # `ls a b` fails when either pattern matches nothing, so check each
            # pattern on its own: one installer missing (say macOS found no
            # runner) must not drop the whole section.
            EXE=$(compgen -G 'Anchor-Setup-*.exe' | head -n1 || true)
            DMG=$(compgen -G 'Anchor-*.dmg' | head -n1 || true)
            if [ -n "$EXE$DMG" ]; then
              echo "## Desktop (Windows, macOS)"
              echo
              if [ -n "$EXE" ]; then
                echo "Windows: run \`$EXE\`, or \`winget install AlxndrJhn.AnchorPlus\` once winget has this version."
              else
                echo "Windows: the installer didn't build for this release."
              fi
              echo
              if [ -n "$DMG" ]; then
                echo "macOS (Apple silicon and Intel): open \`$DMG\` and drag Anchor+ to Applications."
              else
                echo "macOS: the installer didn't build for this release."
              fi
              echo
              echo "On first launch it asks for your Anchor server's address."
              echo
              echo 'The installers are not signed. On Windows, if SmartScreen stops it, choose More info › Run anyway. On macOS, right-click the app and choose Open the first time, or allow it under System Settings › Privacy & Security.'
              echo
            elif [ -n "$DESKTOP_TAG" ]; then
              echo "## Desktop (Windows, macOS)"
              echo
              echo "Nothing changed for the desktop app, so this release has no installers. The newest ones are in [$DESKTOP_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$DESKTOP_TAG)."
              echo
            fi
            if [ -n "$EXE$DMG" ] || compgen -G 'anchor-plus*.apk' >/dev/null; then
              echo "## Verifying a download"
              echo
              echo "Each file attached here has a signed record that it was built by this repository's release workflow from ${GITHUB_SHA::7}. To check one, with the [GitHub CLI](https://cli.github.com):"
              echo
              echo '```bash'
              echo "gh attestation verify <file> --repo $GITHUB_REPOSITORY"
              echo '```'
              echo
            fi
            echo "## Docker (amd64, arm64)"
            echo
            # The "Check what changed" step reads the image tag from this line.
            echo '```bash'
            echo "docker pull $IMAGE:${DOCKER_TAG:-$TAG}"
            echo '```'
            echo
            if [ "$CANDIDATE" = true ]; then
              echo "Also published as \`$PREVIEW_IMAGE\`, which preview servers run."
            elif [ -n "$DOCKER_TAG" ]; then
              echo "Nothing changed for the server, so this release has no new image; the one above (also \`$IMAGE:latest\`) is still current."
            else
              echo "Also published as \`$IMAGE:latest\` and \`$IMAGE:sha-${GITHUB_SHA::7}\`."
            fi
            echo
            # The app's "What's new" lists only these. Always written, even
            # empty, so the app doesn't fall back to every change.
            ANDROID_PATHS=(mobile/lib mobile/android mobile/assets mobile/pubspec.lock)
            echo "## Android changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              ANDROID_LOG=$(git log --no-merges --format='- %s (%h)' "$PREVIOUS..HEAD" -- "${ANDROID_PATHS[@]}")
            else
              ANDROID_LOG=$(git log --no-merges --format='- %s (%h)' -20 -- "${ANDROID_PATHS[@]}")
            fi
            echo "${ANDROID_LOG:-Nothing changed in the Android app.}"
            echo
            echo "## Changes"
            echo
            if [ -n "$PREVIOUS" ]; then
              git log --no-merges --format='- %s (%h)' "$PREVIOUS..HEAD"
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS...$TAG"
            else
              git log --no-merges --format='- %s (%h)' -20
            fi
          } > notes.md
          shopt -s nullglob
          if [ "$CANDIDATE" = true ]; then
            KIND=(--prerelease --latest=false)
            TITLE="Anchor+ $TAG (release candidate)"
          else
            KIND=(--latest)
            TITLE="Anchor+ $TAG"
          fi
          gh release create "$TAG" anchor-plus*.apk Anchor-*.exe Anchor-*.dmg \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file notes.md \
            "${KIND[@]}"
          # Superseded by the per-commit releases above.
          gh release delete android-latest --cleanup-tag --yes || true

      # The same release again under its old-style tag and APK names, which
      # apps installed before the rename look for (see the header). Never the
      # "latest" release, so GitHub's release page keeps pointing at the v one.
      - name: Publish the bridge copy
        if: inputs.bridge
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          CANDIDATE: ${{ needs.version.outputs.candidate }}
        run: |
          shopt -s nullglob
          OLD_TAG="fork-${TAG#v}"
          for apk in anchor-plus*.apk; do cp "$apk" "anchor-fork${apk#anchor-plus}"; done
          {
            echo "The same build as [$TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG), under its old-style name, so that apps installed before the rename update to it. Take the files from $TAG."
            echo
            sed -n '/^## Android changes/,$p' notes.md
          } > bridge.md
          KIND=(--latest=false)
          if [ "$CANDIDATE" = true ]; then KIND+=(--prerelease); fi
          gh release create "$OLD_TAG" anchor-fork*.apk Anchor-*.exe Anchor-*.dmg \
            --target "$GITHUB_SHA" \
            --title "Anchor+ $OLD_TAG (bridge)" \
            --notes-file bridge.md \
            "${KIND[@]}"

  # Sends a release's new Windows installer to winget: a pull request to
  # microsoft/winget-pkgs with its manifests (desktop/winget/manifests.sh),
  # opened from the WINGET_TOKEN owner's fork of it. Microsoft's checks and
  # reviewers merge it, and `winget install AlxndrJhn.AnchorPlus` (or
  # `winget upgrade`) then gets it. The first one adds the package. Without
  # the secret (a classic token with public_repo) it is skipped. Candidates
  # stay off winget, which has no previews.
  winget:
    needs: [version, build-desktop, release]
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      needs.release.result == 'success' && needs.version.outputs.desktop == 'true' &&
      needs.version.outputs.candidate != 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Missing when only the macOS one built.
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: anchor-desktop-windows
          path: installer

      - name: Submit to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.version.outputs.anchor_version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::notice::No WINGET_TOKEN secret, so this release isn't sent to winget."
            exit 0
          fi
          if ! ls installer/Anchor-Setup-*.exe >/dev/null 2>&1; then
            echo "::warning::The Windows installer didn't build, so there is nothing to send to winget."
            exit 0
          fi
          desktop/winget/manifests.sh "$VERSION" "$TAG" "$GITHUB_REPOSITORY" \
            installer/Anchor-Setup-*.exe manifests
          curl -fsSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          ./wingetcreate.exe submit --token "$WINGET_TOKEN" \
            --prtitle "New version: AlxndrJhn.AnchorPlus version $VERSION" manifests

  # A candidate republishes Pages for the preview F-Droid repository, with
  # the last release's web app. It follows any release that went out, also
  # one whose desktop installers failed to build.
  pages:
    needs: [version, release]
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      needs.release.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    with:
      anchor-version: >-
        ${{ needs.version.outputs.candidate == 'true' && needs.version.outputs.released_version
          || needs.version.outputs.anchor_version }}
      web-ref: ${{ needs.version.outputs.candidate == 'true' && needs.version.outputs.released || '' }}
