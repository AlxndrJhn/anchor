name: Scorecard

# OpenSSF Scorecard: checks the repository's security practices (branch
# protection, pinned dependencies, token permissions, a security policy,
# signed releases and more). Results show under the Security tab and are
# published to the public Scorecard API, which the README badge reads.
#
# The Scorecard action restricts what this workflow may contain when it
# publishes results: no top-level write permissions, no extra steps that run
# code, and only the actions below.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
