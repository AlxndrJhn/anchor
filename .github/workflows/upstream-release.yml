name: Upstream release

# When ZhFahim/anchor publishes a regular release (not a prerelease), Claude
# merges upstream's main into a branch upstream-sync/<tag> off this fork's
# main, resolves the conflicts, runs the checks and opens a PR. GitHub can't
# send another repository's release events here, so this looks every few
# hours; a release whose commit main already has is skipped, and so is one
# that already has a PR (an open one, or a closed one unless started by hand).
#
# Start it by hand (Actions › Upstream release › Run workflow) to try again,
# e.g. after closing its PR.
#
# Needs the Claude GitHub app installed on this repository, and a
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY
# secret. The app pushes the branch and opens the PR, so CI runs on it, which
# it wouldn't for a PR opened with the workflow's own token.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: ZhFahim/anchor

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      branch: ${{ steps.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look for a new upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # /releases/latest is the newest release that is neither a draft
          # nor a prerelease.
          TAG=$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name)
          BRANCH="upstream-sync/$TAG"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$TAG:refs/upstream-release"
          if git merge-base --is-ancestor refs/upstream-release origin/main; then
            echo "main already has upstream $TAG."
            exit 0
          fi
          OPEN=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -n "$OPEN" ]; then
            echo "$TAG already has a PR: $OPEN"
            exit 0
          fi
          CLOSED=$(gh pr list --head "$BRANCH" --state closed --json url -q '.[0].url')
          if [ -n "$CLOSED" ] && [ "$MANUAL" != true ]; then
            echo "$TAG had a PR that was closed: $CLOSED. Run this workflow by hand to try again."
            exit 0
          fi
          echo "Upstream released $TAG; merging it."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  merge:
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
      # The Claude GitHub app's token is fetched with the workflow's OIDC token.
      id-token: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
      BRANCH: ${{ needs.check.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream main

      # The toolchains of ci.yml, so Claude can regenerate lockfiles and
      # generated code and run the checks. Upstream may move them on; Claude
      # says so in the PR when its checks needed a newer one.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: server/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Merge with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 400
            --allowedTools Bash,Read,Edit,Write,Glob,Grep,TodoWrite
          prompt: |
            You are in a checkout of AlxndrJhn/anchor, "Anchor+": a fork of
            ZhFahim/anchor (remote `upstream`) with its own features. Upstream
            just released ${{ needs.check.outputs.tag }}. Bring upstream's
            `main` into the fork and open a PR for the owner to review.

            1. Create the branch `${{ needs.check.outputs.branch }}` from
               `main` and run `git merge --no-ff upstream/main`. Merge, don't
               rebase: the merge commit is what lets the next upstream merge
               stay small. Name it "Merge upstream ZhFahim/anchor <version>"
               (the version without its "v"). Earlier upstream merges, like
               957069c2 (`git show 957069c2`, `git log --merges`), show how
               conflicts were resolved before.
            2. Resolve every conflict, reading both sides' history
               (`git log upstream/main`, `git log main -- <file>`) to
               understand what each side meant:
               - Where the fork and upstream both built the same thing, take
                 upstream's version and keep only what the fork adds on top,
                 so later merges stay small. Remove fork code (and its tests)
                 that upstream's version makes unnecessary.
               - Keep the Anchor+ branding (name, icon, Android package
                 `com.alxndrjhn.anchorplus`), the fork's README, and the
                 fork's own workflows (release-fork.yml, pages.yml, this one,
                 the `build-args` input of docker-build.yml). Bring toolchain
                 version bumps from upstream's workflows into the fork's.
               - Lockfiles and generated code (pnpm-lock.yaml, pubspec.lock,
                 Prisma client, freezed/drift/riverpod `.g.dart` and
                 `.freezed.dart`) are regenerated, not merged by hand:
                 `pnpm install` in server, web and desktop;
                 `flutter pub get` and
                 `dart run build_runner build --delete-conflicting-outputs`
                 in mobile.
               - Database migrations: keep both sides' and make sure the
                 fork's still apply after upstream's (check timestamps).
            3. Run the checks of .github/workflows/ci.yml: in server
               `pnpm exec prisma generate`, `pnpm check`, `pnpm test`; in
               web `pnpm check`, `pnpm test`, `pnpm build`; in desktop
               `pnpm run check`; in mobile `flutter analyze`, `flutter test`.
               Fix what the merge broke. Don't fix failures that main has
               too; list them in the PR.
            4. Push the branch and open a PR against `main` with `gh pr create`,
               titled like "Merge upstream ZhFahim/anchor 0.19.0". Write the
               body for the fork's owner, in plain sentences, like the body of
               the PR for 957069c2 (`gh pr list --state merged --search "Merge
               upstream" --json number,body`): how many upstream commits and
               conflicting files; "What comes in from upstream", grouped by
               web, Android, desktop, server and stack; "How overlaps were
               resolved", for each place where upstream's version replaced
               the fork's, what changes for the fork's users; "Kept from the
               fork"; "Checks", with what passed and what failed and why.
               End it with:

               🤖 Generated with [Claude Code](https://claude.com/claude-code)

            If you can't finish the merge sensibly (a conflict needs the
            owner's decision, or checks fail in a way you can't fix), still
            push what you have and open the PR as a draft whose body starts
            with what needs deciding. Never push to `main`, and don't merge
            the PR.
