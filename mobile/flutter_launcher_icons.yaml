# dart run flutter_launcher_icons
#
# The icon is drawn by tool/launcher_icon/: render.js writes Android's
# adaptive icon straight into android/app/src/main/res (so Android is off
# here), and render-assets.js writes the images below.
flutter_launcher_icons:
  image_path: "assets/icons/anchor_icon.png"

  android: false

  # iOS rounds the corners itself and wants no transparency.
  ios: true
  image_path_ios: "assets/icons/app_icon_square.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/anchor_icon.png"
    background_color: "#2D3142"
    theme_color: "#2D3142"

  windows:
    generate: true
    image_path: "assets/icons/anchor_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icons/anchor_icon.png"
