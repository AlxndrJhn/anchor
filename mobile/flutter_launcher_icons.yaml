# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/anchor_icon.png"

  # Android's skeuomorphic icon is drawn by tool/launcher_icon/render.js;
  # these are its xxxhdpi layers.
  android: "launcher_icon"
  image_path_android: "assets/icons/launcher_legacy.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/icons/launcher_background.png"
  adaptive_icon_foreground: "assets/icons/launcher_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icons/launcher_monochrome.png"

  ios: true
  # image_path_ios: "assets/icon/icon.png"
  remove_alpha_ios: true
  # image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  # image_path_ios_tinted_grayscale: "assets/icon/icon_tinted.png"
  # desaturate_tinted_to_grayscale_ios: true
  # background_color_ios: "#ffffff"