# Native (OS-level) splash screens, matching the app's light/dark backgrounds.
#
# The splash logos are the app icon:
#   - splash_logo.png: 512px, in the iPhone icon's shape, shown at a fixed logo
#     size on iOS and older Android
#   - splash_logo_android12*.png: 1152px canvas with the icon in the middle 768px
#     circle that Android 12+ shows
#
# Regenerate after changes: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F0F4F8"
  color_dark: "#111214"
  image: assets/icons/splash_logo.png

  android_12:
    color: "#F0F4F8"
    color_dark: "#111214"
    image: assets/icons/splash_logo_android12.png
    image_dark: assets/icons/splash_logo_android12_dark.png

  web: false
